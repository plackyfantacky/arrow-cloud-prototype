<div class="editor-panel editor-path-controls">
    <div class="row">
        <button type="button" class="editor-path-controls__toggle grow" data-action="toggle-panel" aria-expanded="true">Path Editor</button>

        <button type="button" class="button icon-button" data-action="new-path" aria-label="New path" title="New path" aria-expanded="false">
            <!-- prettier-ignore -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
                <path d="M14 2v6h6" />
                <path d="M12 12v6M9 15h6" />
            </svg>
        </button>
    </div>

    <section class="path-creation-panel" data-path-create popover="manual" role="dialog" aria-label="New path">
        <div class="row">
            <strong class="grow">New path</strong>
            <button type="button" class="button icon-button" data-action="close-path-create" aria-label="Close new path" title="Close">×</button>
        </div>
        <div class="column gap-4">
            <div class="field">
                <label>New path origin</label>

                <div class="row">
                    <label class="field path-initial-direction">
                        Initial direction
                        <select class="select" data-control="path-initial-direction">
                            <option value="+x">+X</option>
                            <option value="-x">-X</option>
                            <option value="+y">+Y</option>
                            <option value="-y">-Y</option>
                            <option value="+z">+Z</option>
                            <option value="-z">-Z</option>
                        </select>
                    </label>
                </div>

                <div class="path-origin-fields row">
                    <label class="path-origin-field field grow">
                        X
                        <input type="number" class="input" data-control="path-origin-x" value="0" step="0.1" />
                    </label>

                    <label class="path-origin-field field grow">
                        Y
                        <input type="number" class="input" data-control="path-origin-y" value="0" step="0.1" />
                    </label>

                    <label class="path-origin-field field grow">
                        Z
                        <input type="number" class="input" data-control="path-origin-z" value="0" step="0.1" />
                    </label>
                </div>
            </div>

            <div class="row">
                <button type="button" class="button grow" data-action="add-path">Add path</button>
                <button type="button" class="button grow" data-action="cancel-path">Cancel</button>
            </div>
        </div>
    </section>

    <div class="editor-path-controls__content" data-panel-content>
        <div class="group">
            <div class="viewport-notice" data-viewport-notice hidden>Viewport-relative origins cannot be moved with TransformControls.</div>
            <strong data-editor-heading>No path selected</strong>
        </div>

        <section class="group" data-path-empty>
            <p class="muted">Select a path in the viewport to edit it, or create a new one.</p>
        </section>

        <section class="group" data-origin-section hidden>
            <h3>Edit path</h3>

            <table class="path-properties-summary" data-path-properties-summary hidden>
                <tbody>
                    <tr>
                        <th colspan="3">Initial direction</th>
                    </tr>
                    <td colspan="3">
                        <span class="value-badge" data-path-summary-direction></span>
                    </td>
                    <tr>
                        <th>X</th>
                        <th>Y</th>
                        <th>Z</th>
                    </tr>
                    <tr>
                        <td><span class="value-badge" data-path-summary-x></span></td>
                        <td><span class="value-badge" data-path-summary-y></span></td>
                        <td><span class="value-badge" data-path-summary-z></span></td>
                    </tr>
                </tbody>
            </table>

            <div class="field" data-path-properties-form>
                <label class="field">
                    Initial direction
                    <select class="select" data-control="selected-initial-direction" disabled>
                        <option value="" disabled>Custom direction</option>
                        <option value="+x">+X</option>
                        <option value="-x">−X</option>
                        <option value="+y">+Y</option>
                        <option value="-y">−Y</option>
                        <option value="+z">+Z</option>
                        <option value="-z">−Z</option>
                    </select>
                </label>

                <div class="row">
                    <label class="field grow">
                        X
                        <input type="number" class="input" data-control="selected-origin-x" step="0.1" disabled />
                    </label>

                    <label class="field grow">
                        Y
                        <input type="number" class="input" data-control="selected-origin-y" step="0.1" disabled />
                    </label>

                    <label class="field grow">
                        Z
                        <input type="number" class="input" data-control="selected-origin-z" step="0.1" disabled />
                    </label>
                </div>
            </div>
        </section>

        <section class="group" data-edit-segment hidden>
            <h3>Edit segment</h3>
            <div class="column gap-4">
                <div class="column">
                    <label class="field">
                        Current Action
                        <select class="select" data-control="current-action" disabled>
                            <option value="forward">Forward</option>
                            <option value="turnLeft">Turn left</option>
                            <option value="turnRight">Turn right</option>
                            <option value="bendUp">Bend up</option>
                            <option value="bendDown">Bend down</option>
                        </select>
                    </label>
                </div>

                <div class="column">
                    <span>Adjust distance</span>
                    <div class="row">
                        <button type="button" class="button icon-button" data-action="nudge-negative" aria-label="Decrease distance" disabled>−</button>
                        <select class="select grow" data-control="nudge-increment" aria-label="Distance increment">
                            <option value="1">1</option>
                            <option value="0.5">0.5</option>
                            <option value="0.25">0.25</option>
                            <option value="0.1">0.1</option>
                            <option value="0.05">0.05</option>
                        </select>
                        <button type="button" class="button icon-button" data-action="nudge-positive" aria-label="Increase distance" disabled>+</button>
                    </div>
                </div>

                <div class="row">
                    <button type="button" class="button grow" data-action="trim-start" disabled>Trim start</button>
                    <button type="button" class="button grow" data-action="trim-end" disabled>Trim end</button>
                    <button type="button" class="button icon-button" data-action="remove" aria-label="Remove segment" title="Remove segment" disabled>
                        <!-- prettier-ignore -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 6h18" />
                            <path d="M8 6V4h8v2" />
                            <path d="M19 6l-1 14H6L5 6" />
                            <path d="M10 11v5" />
                            <path d="M14 11v5" />
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <section class="group" data-add-segment hidden>
            <button type="button" class="button full" data-action="toggle-add-segment" aria-expanded="false">
                Add segment
            </button>

            <section class="path-creation-panel" data-add-segment-content popover="manual" role="dialog" aria-label="Add segment">
                <div class="row">
                    <strong class="grow">Add segment</strong>
                    <button type="button" class="button icon-button" data-action="close-add-segment" aria-label="Close add segment" title="Close">×</button>
                </div>

                <label class="field">
                    New Action
                    <select class="select" data-control="new-action" disabled>
                        <option value="forward">Forward</option>
                        <option value="turnLeft">Turn left</option>
                        <option value="turnRight">Turn right</option>
                        <option value="bendUp">Bend up</option>
                        <option value="bendDown">Bend down</option>
                    </select>
                </label>

                <div class="column gap-4">
                    <div class="row">
                        <button type="button" class="button grow" data-action="insert-before" disabled>Insert Before</button>
                        <button type="button" class="button grow" data-action="insert-after" disabled>Insert After</button>
                    </div>
                    
                    <button type="button" class="button grow" data-action="duplicate" disabled>Duplicate</button>
                    <button type="button" class="button full" data-action="cancel-add-segment">Cancel</button>
                </div>
            </section>
        </section>
        <section class="group" data-export-data hidden>
            <!-- prettier-ignore -->
            <button type="button" class="button primary full path-export-button" data-action="copy" title="Copy selected path as JSON" aria-label="Export: copy selected path as JSON" disabled>
                <!-- prettier-ignore -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 16V3M7 8l5-5 5 5" />
                    <path d="M4 16v5h16v-5" />
                </svg>
                <span>Export</span>
            </button>
        </section>

        <section class="group" data-path-actions hidden>
            <button type="button" class="button danger full" data-action="remove-path" disabled>Delete path</button>
        </section>
    </div>
</div>
