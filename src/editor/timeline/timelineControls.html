<div class="editor-timeline-controls" data-editor-timeline-controls>
    <label>
        Dataset
        <select data-control="dataset">
            <option value="labs">Labs</option>
            <option value="flatpack">Flatpack</option>
            <option value="demo">Demo</option>
        </select>
    </label>
    <button type="button" data-action="play-pause">
        Pause
    </button>

    <button type="button" data-action="rewind">
        Rewind
    </button>

    <label>
        <input
            type="checkbox"
            data-control="loop"
        >
        Loop
    </label>

    <label style="display:flex; align-items: center; gap: 0.5rem">
        Time

        <input
            type="range"
            min="0"
            step="0.01"
            data-control="time"
        >

        <span data-value="time"></span>
    </label>

    <label style="display:flex; align-items: center; gap: 0.5rem">
        Speed

        <input
            type="range"
            min="0.1"
            max="2"
            step="0.1"
            data-control="speed"
        >

        <span data-value="speed"></span>
    </label>
    </div>
</div>
